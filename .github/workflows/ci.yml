name: CI/CD Pipeline

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: Run Backend Tests ─────────────────────────────────────────────────
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: innervoice
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root --password=${{ secrets.DB_PASSWORD }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: InnerVoice/server

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: InnerVoice/server/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Apply DB schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -p"${{ secrets.DB_PASSWORD }}" innervoice < ../docker/init.sql

      - name: ✅ Run tests
        env:
          PORT: 5000
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: innervoice
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: npm test

  # ── Job 2: Build Client ──────────────────────────────────────────────────────
  build-client:
    name: 🏗️ Build Client
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: InnerVoice/client

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: InnerVoice/client/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Vite app
        run: npm run build

  # ── Job 3: Build Docker Images ───────────────────────────────────────────────
  build-docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, build-client]

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build & push server image
        uses: docker/build-push-action@v5
        with:
          context: ./InnerVoice/server
          file: ./InnerVoice/server/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/innervoice-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build & push client image
        uses: docker/build-push-action@v5
        with:
          context: ./InnerVoice/client
          file: ./InnerVoice/client/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/innervoice-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 4: Validate Compose File ─────────────────────────────────────────────
  validate-compose:
    name: ✅ Validate docker-compose.yml
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Validate compose config
        run: docker compose -f InnerVoice/docker-compose.yml config --quiet