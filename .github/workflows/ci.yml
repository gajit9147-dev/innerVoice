name: CI/CD Pipeline

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  # ── Job 1: Run Backend Tests ─────────────────────────────────────────────────
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest

    # secrets context is NOT available inside 'services:' blocks on GitHub Actions.
    # Use a simple alphanumeric CI-only password — special chars like @ break --health-cmd.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: CITestPass123
          MYSQL_DATABASE: innervoice
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pCITestPass123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: InnerVoice/server

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: InnerVoice/server/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Apply DB schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pCITestPass123 innervoice < ../docker/init.sql

      - name: ✅ Run tests
        env:
          PORT: 5000
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: CITestPass123  # must match the service container password above
          DB_NAME: innervoice
          JWT_SECRET: 'ci-test-secure-jwt-secret-key-12345'
          GEMINI_API_KEY: 'ci-test-gemini-key'
          CLOUDINARY_CLOUD_NAME: 'ci-test-cloudinary-cloud-name'
          CLOUDINARY_API_KEY: 'ci-test-cloudinary-api-key'
          CLOUDINARY_API_SECRET: 'ci-test-cloudinary-api-secret'
        run: |
          npm test > test_output.log 2>&1 || (cat test_output.log && exit 1)

      - name: 📤 Push logs to repo on failure
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ci-logs || (git fetch origin ci-logs && git checkout ci-logs)
          cp test_output.log ../../ || true
          git add ../../test_output.log || true
          git commit -m "chore: upload CI test logs [skip ci]" || true
          git push origin ci-logs --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2: Build Client ──────────────────────────────────────────────────────
  build-client:
    name: 🏗️ Build Client
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: InnerVoice/client

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: InnerVoice/client/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Vite app
        run: npm run build

  # ── Job 3: Build Docker Images ───────────────────────────────────────────────
  build-docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, build-client]

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build & push server image
        uses: docker/build-push-action@v5
        with:
          context: ./InnerVoice/server
          file: ./InnerVoice/server/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/innervoice-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build & push client image
        uses: docker/build-push-action@v5
        with:
          context: ./InnerVoice/client
          file: ./InnerVoice/client/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/innervoice-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 4: Validate Compose File ─────────────────────────────────────────────
  validate-compose:
    name: ✅ Validate docker-compose.yml
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 📄 Create stub .env.docker for compose validation
        # server/.env.docker is gitignored — create a minimal stub so docker compose
        # config can resolve the env_file reference without failing.
        run: |
          cat > InnerVoice/server/.env.docker << 'EOF'
          PORT=5000
          DB_HOST=db
          DB_USER=root
          DB_PASSWORD=test
          DB_NAME=innervoice
          DB_PORT=3306
          JWT_SECRET=ci-stub-secret-for-validation-only
          GEMINI_API_KEY=stub
          CLOUDINARY_CLOUD_NAME=stub
          CLOUDINARY_API_KEY=stub
          CLOUDINARY_API_SECRET=stub
          EOF

      - name: 🐳 Validate compose config
        run: docker compose -f InnerVoice/docker-compose.yml config --quiet