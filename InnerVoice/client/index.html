<!doctype html>
<html lang="en" style="background-color: #090a0e; color: #f5f2eb;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>InnerVoice — A safe space for your real self</title>
    <!-- Google Fonts: Newsreader (Editorial Serif), Plus Jakarta Sans (Modern Clean Sans), Caveat (Delicate Handwritten Script) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Official Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      @keyframes iv-spin {
        to { transform: rotate(360deg); }
      }
      body {
        margin: 0;
        background-color: #090a0e;
        color: #f5f2eb;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
    <!-- Resilient error catcher: guarantees screen is never blank if script execution fails -->
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.includes('iv-spin'))) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#090a0e;color:#f5f2eb;padding:24px;text-align:center;"><div style="max-width:420px;background:rgba(22,25,31,0.96);border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:32px;box-shadow:0 25px 60px rgba(0,0,0,0.8);"><div style="width:48px;height:48px;border-radius:50%;background:rgba(226,177,122,0.15);color:#e2b17a;display:flex;align-items:center;justify-content:center;margin:0 auto 16px auto;font-size:20px;">✦</div><h2 style="font-family:serif;font-size:24px;margin:0 0 10px 0;font-weight:normal;color:#f5f2eb;">Restoring Sanctuary</h2><p style="font-size:13px;color:#9e9990;line-height:1.6;margin:0 0 24px 0;">An update was deployed. Click below to load the fresh application.</p><button onclick="if(window.navigator&&navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(r){for(var i=0;i<r.length;i++)r[i].unregister();window.location.reload();});}else{window.location.reload();}" style="background:linear-gradient(180deg,#dfbc86 0%,#c89e62 100%);border:none;color:#121418;font-weight:600;font-size:13px;padding:12px 28px;border-radius:14px;cursor:pointer;box-shadow:0 4px 16px rgba(226,177,122,0.35);">Refresh Sanctuary</button></div></div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Lightweight pre-mount skeleton: eliminates blank screen flash while bundle parses -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #090a0e; color: #f5f2eb;">
        <div style="width: 42px; height: 42px; border: 2px solid rgba(226, 177, 122, 0.15); border-top-color: #e2b17a; border-radius: 50%; animation: iv-spin 0.85s linear infinite;"></div>
        <div style="margin-top: 18px; font-size: 13px; color: #9e9990; font-family: serif; font-style: italic; letter-spacing: 0.04em;">InnerVoice • A safe space for your real self</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
