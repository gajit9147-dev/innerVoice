services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: innervoice_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Ajeet@8787095611}
      POSTGRES_DB: ${DB_NAME:-innervoice}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-innervoice}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - innervoice_net

  # ── Node.js Backend ─────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: innervoice_server
    restart: unless-stopped
    env_file:
      - ./server/.env.docker
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - innervoice_net

  # ── React Frontend (Nginx) ───────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: innervoice_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - innervoice_net

# ── Named Volumes ───────────────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local

# ── Networks ────────────────────────────────────────────────────────────────────
networks:
  innervoice_net:
    driver: bridge
